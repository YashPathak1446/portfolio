<svg xmlns="http://www.w3.org/2000/svg" width="680" height="415" viewBox="0 0 680 415" role="img" font-family="ui-monospace, 'JetBrains Mono', monospace">
<title>Search engine index-time and query-time pipeline</title>
<desc>Index time flows left to right: crawl, tokenize, buffer in memory, merge to disk. Both the postings file and the term offset map live on disk. Query time flows left to right: order query terms by IDF, prune stop words, seek directly to a term's posting line on disk, then rank by TF-IDF.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g fill="#e9f0ed" stroke="#1d6e5a" stroke-width="0.5">
<rect x="48" y="50" width="128" height="56" rx="8"/><rect x="200" y="50" width="128" height="56" rx="8"/><rect x="352" y="50" width="128" height="56" rx="8"/><rect x="504" y="50" width="128" height="56" rx="8"/>
</g>
<g fill="#14483a" font-size="14" text-anchor="middle" dominant-baseline="central">
<text x="112" y="68">Crawl</text><text x="264" y="68">Tokenize</text><text x="416" y="68">Buffer</text><text x="568" y="68">Merge</text>
</g>
<g fill="#1d6e5a" font-size="12" text-anchor="middle" dominant-baseline="central">
<text x="112" y="88">dedupe by URL</text><text x="264" y="88">lowercase</text><text x="416" y="88">flush at 100MB</text><text x="568" y="88">two-way merge</text>
</g>

<g stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)" fill="none">
<line x1="180" y1="78" x2="196" y2="78"/><line x1="332" y1="78" x2="348" y2="78"/><line x1="484" y1="78" x2="500" y2="78"/><line x1="568" y1="110" x2="568" y2="176"/>
</g>

<rect x="48" y="180" width="584" height="96" rx="16" fill="#f1f2f4" stroke="#c8cdd5" stroke-width="0.5"/>
<text x="340" y="200" font-size="14" fill="#3d4653" text-anchor="middle" dominant-baseline="central">On disk</text>
<g fill="#ffffff" stroke="#c8cdd5" stroke-width="0.5">
<rect x="80" y="214" width="240" height="48" rx="8"/><rect x="360" y="214" width="240" height="48" rx="8"/>
</g>
<g font-size="14" fill="#14181f" text-anchor="middle" dominant-baseline="central">
<text x="200" y="230">indexer.tsv</text><text x="480" y="230">offset map</text>
</g>
<g font-size="12" fill="#6b7684" text-anchor="middle" dominant-baseline="central">
<text x="200" y="249">positional postings</text><text x="480" y="249">term to byte offset</text>
</g>

<line x1="416" y1="278" x2="416" y2="306" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)" fill="none"/>

<g fill="#eef0f6" stroke="#4a4f8c" stroke-width="0.5">
<rect x="48" y="310" width="128" height="56" rx="8"/><rect x="200" y="310" width="128" height="56" rx="8"/><rect x="352" y="310" width="128" height="56" rx="8"/><rect x="504" y="310" width="128" height="56" rx="8"/>
</g>
<g fill="#2f3369" font-size="14" text-anchor="middle" dominant-baseline="central">
<text x="112" y="328">Query terms</text><text x="264" y="328">Prune</text><text x="416" y="328">Seek</text><text x="568" y="328">Rank</text>
</g>
<g fill="#4a4f8c" font-size="12" text-anchor="middle" dominant-baseline="central">
<text x="112" y="348">sorted by IDF</text><text x="264" y="348">cut stop words</text><text x="416" y="348">one line read</text><text x="568" y="348">TF-IDF, top 5</text>
</g>

<g stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)" fill="none">
<line x1="180" y1="338" x2="196" y2="338"/><line x1="332" y1="338" x2="348" y2="338"/><line x1="484" y1="338" x2="500" y2="338"/>
</g>

<text x="340" y="395" font-size="12" fill="#6b7684" text-anchor="middle">Green = index time, runs once.  Indigo = query time, runs per search.</text>
</svg>
