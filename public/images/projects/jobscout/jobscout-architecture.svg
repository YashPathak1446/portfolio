<svg xmlns="http://www.w3.org/2000/svg" width="680" height="306" viewBox="0 0 680 306" role="img" font-family="ui-monospace, 'JetBrains Mono', monospace">
<title>JobScout four-agent pipeline</title>
<desc>An orchestrator holds run state across four agents that run left to right: discovery pulls postings, enrichment scrapes each full description, analysis scores the posting against resume components, and generation writes a tailored resume. Generation output splits two ways: valid resumes are written to a dated output folder, and resumes that fail validation twice are written to a needs-review folder rather than discarded.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="40" y="56" width="600" height="112" rx="16" fill="none" stroke="#9aa2ad" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="58" y="80" font-size="12" fill="#6b7684">Orchestrator — holds run state across stages</text>

<g fill="#e9f0ed" stroke="#1d6e5a" stroke-width="0.5">
<rect x="58" y="98" width="126" height="56" rx="8"/><rect x="204" y="98" width="126" height="56" rx="8"/><rect x="350" y="98" width="126" height="56" rx="8"/><rect x="496" y="98" width="126" height="56" rx="8"/>
</g>
<g fill="#14483a" font-size="14" text-anchor="middle" dominant-baseline="central">
<text x="121" y="116">Discovery</text><text x="267" y="116">Enrichment</text><text x="413" y="116">Analysis</text><text x="559" y="116">Generation</text>
</g>
<g fill="#1d6e5a" font-size="12" text-anchor="middle" dominant-baseline="central">
<text x="121" y="136">pulls postings</text><text x="267" y="136">scrapes full JD</text><text x="413" y="136">scores fit</text><text x="559" y="136">writes resume</text>
</g>

<g stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)" fill="none">
<line x1="188" y1="126" x2="200" y2="126"/><line x1="334" y1="126" x2="346" y2="126"/><line x1="480" y1="126" x2="492" y2="126"/>
</g>

<path d="M559 158 L559 186 L370 186 L370 204" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M559 186 L559 204" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="290" y="208" width="160" height="56" rx="8" fill="#f1f2f4" stroke="#c8cdd5" stroke-width="0.5"/>
<text x="370" y="226" font-size="14" fill="#14181f" text-anchor="middle" dominant-baseline="central">Tailored resume</text>
<text x="370" y="246" font-size="12" fill="#6b7684" text-anchor="middle" dominant-baseline="central">passed validation</text>

<rect x="479" y="208" width="160" height="56" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="0.5"/>
<text x="559" y="226" font-size="14" fill="#633806" text-anchor="middle" dominant-baseline="central">needs_review/</text>
<text x="559" y="246" font-size="12" fill="#854f0b" text-anchor="middle" dominant-baseline="central">written, not discarded</text>
</svg>
